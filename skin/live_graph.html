<body>
<header class="top"><span class="wm">AI4<b>BCM</b></span><span class="prod">nemo</span><span class="where">Dependency graph</span>
<span class="badge">PROTOTYPE</span><a class="back" id="back" href="#">&#8592; Chat</a></header>
<main class="shell" id="shell"><div class="gwrap" id="gwrap"></div></main>
<script type="application/json" id="island">{{island}}</script>
<script>
const ISLAND = JSON.parse(document.getElementById("island").textContent);
const D = ISLAND.data, ASK = ISLAND.ask;
document.getElementById("back").href = ISLAND.back;
// 639 amend (owner via 49): "← Chat" closes this tab where it came from the chat; where the browser
// keeps it open, or it came from elsewhere (a bookmark), the link takes him to the chat. 643: the
// chat's link marks the address (#from-chat), since nginx sends no referrer to tell it; taken off
// the address, so a bookmark or a copied link never carries it. 654: kept in the tab's
// sessionStorage, so a reload and the BIA picker keep it and a fresh tab has none; a view's own
// words (#chain=…) stay; kept by the room's chat, so another room's graph in that tab has none; a
// storage that throws keeps no mark
const MARK = "#from-chat", FROM_CHAT = (() => {
  const words = location.hash.slice(1).split("&"), marked = words.includes(MARK.slice(1));
  const view = words.filter(w => w && w !== MARK.slice(1)).join("&"), key = MARK + " " + ISLAND.back;
  if (marked) history.replaceState(history.state, "", location.pathname + location.search + (view && "#" + view));
  try { if (marked) sessionStorage.setItem(key, "1"); return marked || sessionStorage.getItem(key) === "1"; }
  catch (e) { return marked; } })();
document.getElementById("back").addEventListener("click", e => {
  const chat = new URL(ISLAND.back, location.href).href;
  if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || !FROM_CHAT) return;
  e.preventDefault(); window.close(); setTimeout(() => { location.href = chat; }, 150); });
// 326's amend (321's R6, moved): Ask nemo is the floating panel A only; a stray ?variant= is ignored
const S = {mode: "bia", sel: new Set(), lit: new Set(), named: new Set(), focus: null, open: false, turns: [], next: [],
           draft: "", busy: false, gap: null, plant: null, opened: new Set(),
           pick: [], more: new Set(), page: [], grp: new Set(), view: "kind", card: false, bp: false, show: null};
// 344: each card's name, never the cards: the server keeps them (live_graph.shipped)
const NAMES = D.names, ACT = "act";
// 356: the boxes always drawn and never filtered (Sites, Power and network), deepest last in their
// column; the columns by kind are the register's six (merge_table.KIND), left to right
const BASE = D.base, isBase = k => BASE.includes(k), depth = k => BASE.indexOf(k) + 1;
// 354: a box's kind (its column's token, never inline) and a real button's attributes (F2)
const kindAttr = b => b && D.kinds[b.col] ? ` data-kind="${D.kinds[b.col]}"` : "";
const btn = on => ` role="button" tabindex="0" aria-pressed="${!!on}"`;
const hands = g => Object.fromEntries([...g.handoffs.up, ...g.handoffs.down].map(h => [h.id, h]));
// 334: Whole company on the laptop draws the one table (D.whole); 332: on the phone, the company's
// boxes (D.company, the same table) through 331's page; every part reads the scope's G, GB, H and A.
// "Open its BIA graph" goes to that activity's own page (332 round 2), never carried in this one
const CO = D.company, A = D.act;
const C = D.whole, CB = C.boxes, CA = Object.fromEntries([...C.acts, ...C.bands, ...C.bands.flatMap(b => b.rows)].map(a => [a.id, a]));
let G, GB, H;
function scope() { G = S.mode === "all" && phview() ? CO : D.g2; GB = cpview() ? CB : G.boxes; H = cpview() ? {} : hands(G); }
const openBia = slug => { location.href = ISLAND.bia + encodeURIComponent(slug); };
const isAct = id => id.startsWith("a:"), actOf = id => CO.acts[id.slice(2)];
const name = id => isAct(id) ? actOf(id).name : id === ACT ? A.name : (H[id] || GB[id] || CA[id] || (Object.hasOwn(NAMES, id) ? {name: NAMES[id]} : G.boxes[id] || CB[id]) || {name: id}).name;
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
// 345 R2: a number keeps its unit ("72 h") and "depend on" its "it" on one line, at every width
const tie = s => s.replace(/(\d) (?=(?:h|d|min|hours?|days?|weeks?|°C)(?!\w))/gi, "$1\u00a0").replace(/\bon it\b/g, "on\u00a0it");
const actFigures = (a = D.act) => [a.mtpd ? "MTPD " + a.mtpd : "MTPD not stated",
                                   a.target ? "Recovery target " + a.target : "No recovery target stated"];

// Ticket 326: G2, the laptop's page for one BIA. Its boxes, lines and "Not drawn" come from the
// register by the skin's rules (live_graph.g2); here they are only laid out, filtered and focused.
const g2edges = () => G.needs.map(b => [ACT, b, true]).concat(DEPS(G).map(([a, b]) => [a, b, false]));
function g2chain(id) { const s = new Set([id]), E = g2edges();
  if (H[id]) return new Set([id, ACT]);  // a handoff lights only itself and the BIA (§9.9)
  // 408: the Sites box lights the activities drawn that run at its sites, a plant those at it
  // (`siteActs`, This BIA only while SITES_LIGHT_ACTIVITIES says so) and the boxes tagged to it
  if (id === "sites") { const at = G.siteActs || {}; (S.plant ? [S.plant] : Object.keys(at)).forEach(p => (at[p] || []).forEach(x => s.add(x)));
    if (S.plant) Object.keys(GB).forEach(k => { if (GB[k].sites[S.plant]) s.add(k); });
    return s; }
  if (id === ACT || !GB[id]) { const todo = [id];  // the BIA card: what it uses, and all beneath
    while (todo.length) { const x = todo.pop(); E.forEach(e => { if (e[0] === x && !s.has(e[1])) { s.add(e[1]); todo.push(e[1]); } }); }
    return s; }
  // part D: a box's chain member by member (merge_table.reach), never box to box through a fold
  const R = reachOf(id);
  [...Object.keys(R.up), ...Object.keys(R.down)].forEach(k => s.add(k));
  if (D.slug in R.acts) s.add(ACT);
  return s; }
// 359 (§12.19): a gap tile is a click: the boxes carrying the gap and what they reach, member by
// member (375 part D), on top of their columns, every other box greyed below; nothing is hidden
function g2gapHot() { const s = new Set();
  Object.keys(GB).forEach(m => { if (GB[m].gaps.includes(S.gap)) g2chain(m).forEach(x => s.add(x)); });
  return s.size ? s : null; }
const g2hot = () => S.focus ? g2chain(S.focus) : S.gap ? g2gapHot() : null;
const g2any = (set, k) => set.has(k) || (GB[k] ? GB[k].members.some(m => set.has(m)) : false);
function g2cls(k, hot) { return (hot && hot.has(k) ? " hot" : "") + (S.sel.has(k) ? " sel" : "")
  + (g2any(S.lit, k) ? " lit" : g2any(S.named, k) ? " named" : ""); }
const capital = s => s.charAt(0).toUpperCase() + s.slice(1);
// 336: a gap badge names the members that carry it ("SINGLE SOURCE: PackForm North GmbH")
const shortName = n => n.replace(/\s*\(.*\)\s*$/, "");
const gapText = (b, whole) => b.gaps.map(g => `${g}: ${b.gapNames[g].map(n => whole ? n : shortName(n)).join(", ")}`);
// 355 F15: a face's gap badge names at most two parts, then "+n"; the strip names them all; 462 B11:
// never the box's own name ("No workaround", not "No workaround: Veterinary and QA release")
const gapFace = b => b.gaps.map(g => { const ns = b.gapNames[g].filter(n => n !== b.name).map(shortName);
  return !ns.length ? capital(g) : `${capital(g)}: ${ns.slice(0, 2).join(", ")}${ns.length > 2 ? ` +${ns.length - 2}` : ""}`; });
// 359 (§12.20): a re-BIA finding on the face is "re-BIA: <member>" in rust, a gap badge's look but
// not a gap; its text is the strip's
const rebiaFace = b => b.rebiaOf && b.rebiaOf.length ? `<span class="rf">${esc(`re-BIA: ${b.rebiaOf.join(", ")}`)}</span>` : "";
// 3_nemo_design's read (C3): named key roles, then "+ n more role(s)"; none named, "n role(s), no figure stated"
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
// W1/W2 (359): a strip's why, none where it is empty or clipped from the record text shown in full
const whyOf = b => { const w = (b.why || "").trim();
  return !w || (b.desc && b.desc.toLowerCase().startsWith(w.toLowerCase().replace(/\.$/, ""))) ? "" : `Why: ${w}`; };
// P1 r2: Whole company's why is one line, "Why: <part> · <part>": the box's own why, then what the
// record says of it and its marks, never a stray unlabelled part (row 20 left the count out)
const clauseOf = b => { const w = whyOf(b).replace(/^Why: /, ""), ps = [w, ...b.said, ...b.marks].filter(Boolean);
  return ps.length ? `Why: ${ps.join(" · ")}` : ""; };
const roles = b => !b.more ? "" : b.named && b.named.length ? `+ ${plural(b.more, "more role")}` : `${plural(b.more, "role")}, no figure stated`;
// 467 (his "B · Owner + leads only", D1): a People box's face is its owner's function and its lead
// functions (live_graph._people_column), each with "no deputy named" where the record names none;
// a band's, and a box with no face, is its name
const ND = "no deputy named", OWNER = "process owner";
const faceName = b => b.people && b.people.fns ? b.people.fns.map(([f, o, d]) => `<div class="pf${o ? " po" : ""}"><span class="fn">${esc(f)}</span>`
  + (d ? "" : `<span class="dn">${ND}</span>`) + (o ? `<span class="pt">${OWNER}</span>` : "") + `</div>`).join("") : `<div class="nm">${esc(b.name)}</div>`;
// H3 / P2: its hover's and its sheet's one count line; a band's, its BIAs and their process owners (the plan's)

  if (!el || phview()) { if (t) t.remove(); return; }
  const L = tipLines(el.dataset.id).filter(Boolean); if (!L.length) return;
  if (!t) { t = document.createElement("div"); t.id = "tip"; t.setAttribute("role", "tooltip"); document.body.appendChild(t); }
  t.dataset.of = el.dataset.id;
  t.innerHTML = tie(`<b>${esc(name(el.dataset.id))}</b>` + L.map(x => `<p>${esc(x)}</p>`).join(""))
    + `<div><button class="op" data-oc="${esc(el.dataset.id)}">Open for the full list</button></div>`;
  place(t, el);
}
// a card beside its box: right of it where it fits, else left; inside the screen and under the
// title row and the gap chips, so its chain line, Add and Clear stay in reach
function place(t, el) {
  const bar = document.querySelector(".bar"), lim = Math.max(8, bar ? bar.getBoundingClientRect().bottom + 8 : 8);
  t.style.maxHeight = `${innerHeight - lim - 8}px`;
  const r = el.getBoundingClientRect(), w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = `${Math.max(8, r.right + 8 + w > innerWidth ? r.left - w - 8 : r.right + 8)}px`;
  t.style.top = `${Math.max(lim, Math.min(r.top, innerHeight - h - 8))}px`;
}
// the Open card of the box `S.oc` (laptop only), beside its box; gone with its box
function openCard() {
  document.querySelectorAll(".ocard").forEach(e => e.remove());
  const el = S.oc && !phview() && document.querySelector(`#g2 [data-id="${CSS.escape(S.oc)}"]`);
  if (!el) { S.oc = null; return; }
  const c = document.createElement("div"); c.className = "ocard"; c.setAttribute("role", "dialog"); c.setAttribute("aria-label", name(S.oc));
  c.innerHTML = tie(`<h2 class="h">${esc(name(S.oc))}</h2>` + (cpview() ? cpopen(S.oc) : g2open(S.oc)));
  document.body.appendChild(c); place(c, el);
}
// the hover card shows for the box under the pointer (its card lets the pointer through to the
// boxes it covers, but for its link); anywhere over it, it stays; another box takes it, or it goes,
// a moment after the pointer leaves box and card (639 H1)
const inTip = e => { const t = document.getElementById("tip"), r = t && t.getBoundingClientRect();
  return !!r && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; };
// (a move counts as an entry: a box the pointer reached under the card takes it once it leaves the card)
let tipFor;  // the box a handover is counting for
function hover(e) {
  const b = e.target.closest("#g2 [data-id]"), id = b ? b.dataset.id : null, t = document.getElementById("tip");
  if (e.target.closest("#tip") || inTip(e) || (t && t.dataset.of === id)) { tipFor = undefined; return clearTimeout(tipOff); }
  if (!t) return b ? tip(b) : undefined;
  if (e.type === "mousemove" && tipFor === id) return;
  clearTimeout(tipOff); tipFor = id; tipOff = setTimeout(() => { tipFor = undefined; tip(b); }, 250);
}
document.addEventListener("mouseover", hover);
document.addEventListener("mousemove", hover);
// the board scrolled: the hover card and the Open card stay beside their boxes
const boxEl = id => id && document.querySelector(`#g2 [data-id="${CSS.escape(id)}"]`);
document.getElementById("gwrap").addEventListener("scroll", () => { [[document.getElementById("tip"), "of"], [document.querySelector(".ocard"), "oc"]]
  .forEach(([c, k]) => { const el = c && boxEl(k === "of" ? c.dataset.of : S.oc); if (el) place(c, el); }); });
// 485: the chat's "Visualise for <resource>" opens the page on that resource's chain
// (`#chain=<box>`, PROTOTYPE_core.CHAIN_VIEW): Whole company, its box chosen as a click or a tap
// chooses it, so what needs it and its own chain light, and the chain is scrolled into view
const asked = new URLSearchParams(location.hash.slice(1)), viewed = asked.get("chain");
if (viewed && CB[viewed] && CO.boxes[viewed]) { S.mode = "all"; S.focus = viewed; S.pick = [viewed]; }
// 524: `#share=<slug>,<slug>` the resources two activities share, `#cut=<box>` what a cut of it reaches
// (the boxes standing on it and the activities that depend on them, the box's own `hot`): one lit set from the page's data
// an activity's cards: its own and its band (as a site's chain lights them)
const cardsOf = s => [CA["act:" + s] && "act:" + s, ...C.bands.filter(b => b.slugs.includes(s)).map(b => b.id)].filter(Boolean);
const share = (asked.get("share") || "").split(",").filter(s => cardsOf(s).length), cut = asked.get("cut");
if (share.length > 1) { S.mode = "all"; S.show = {label: share.map(s => CA[cardsOf(s)[0]].name).join(" and ") + " share",
  hot: new Set([...share.flatMap(cardsOf), ...Object.keys(CB).filter(k => CB[k].col !== "People" && share.every(s => (CB[k].rowsBy[s] || []).length) && CB[k].rowsBy[share[0]].some(r => share.every(s => CB[k].rowsBy[s].includes(r))))])}; }
else if (cut && CB[cut]) { S.mode = "all"; S.show = {label: CB[cut].name + " cut", hot: new Set(CB[cut].hot)}; }
else if (cut && (C.siteActs || {})[cut]) { S.mode = "all";  // a site: a plant of the Sites box
  S.show = {label: CB.sites.plants.find(p => p.id === cut).name + " cut",
    hot: new Set(["sites", ...Object.keys(CB).filter(k => CB[k].sites[cut]), ...C.siteActs[cut].flatMap(cardsOf)])}; }
render();
if (S.focus) (phview() ? document.querySelector("#ph .ph-chain > .t") : boxEl(S.focus))?.scrollIntoView({block: phview() ? "start" : "nearest", inline: "nearest"});
document.fonts.ready.then(render);  // the lines again, in the type the page is read in
</script>
