name: tests
on: [push]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r skin/requirements.txt
      - run: .venv/bin/pip install -e '.[dev]'
      - run: ./gate.sh
